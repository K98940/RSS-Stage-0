<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="shortcut icon" href="./assets/icons/favicon.svg" type="image/x-icon" />
    <title>Random Game</title>
  </head>

  <body>
    <dialog class="dialog" id="dialog">
      <div class="dialog-conteiner border">
        <div class="dialog-img"></div>
        <p id="dialog-content"></p>
        <form method="dialog">
          <input
            class="border"
            id="input-nickname"
            type="search"
            maxlength="32"
            placeholder="enter your nick"
            title="enter your name (maximum 32 characters)" />
          <button class="border">OK</button>
        </form>
      </div>
    </dialog>

    <header>
      <div class="container">
        <div class="title-container">
          <span>RANDOM GAME</span>
        </div>

        <div class="slider volume-container" title="volume">
          <label for="volume"></label>
          <div class="wrapper-score">
            <input type="range" id="volume" min="0" max="1" step="0.05" />
            <div class="fill"></div>
          </div>
        </div>

        <div class="hint-container flex-center-center">
          <input type="checkbox" name="" id="hint" />
          <label for="hint" title="Show hints with numbers on game blocks"></label>
        </div>
        <div
          class="range-container flex-center-center"
          title="Switching the mode changes the number of points needed to complete the game">
          <div class="range-icon" id="icon-game">
            <img src="./assets/icons/game-controller.webp" id="select-mode-game" alt="game-controller-icon" />
          </div>
          <label for="range-level" id="range-level-label">4</label>
          <input type="range" id="range-level" list="range-markers" min="4" max="6" step="1" value="4" />
          <datalist id="range-markers">
            <option value="6"></option>
            <option value="5"></option>
            <option value="4"></option>
          </datalist>

          <div class="range-icon" id="icon-test">
            <img src="./assets/icons/test.webp" alt="test-icon" />
          </div>
        </div>
      </div>
    </header>

    <div class="game-container flex-center-center">
      <div class="score border flex-center-center bg-white-blur">
        <label for="input-score">0</label>
        <div class="wrapper-score">
          <input type="range" id="input-score" value="0" min="0" max="100" disabled />
          <div class="fill"></div>
        </div>
        <span id="score-max"></span>
      </div>

      <div class="desk-records-container flex-center-center">
        <div class="desk-container border flex-center-center bg-white-blur" id="desk-container" tabindex="1"></div>
        <div class="records border bg-white-blur" id="records"></div>
      </div>

      <div id="test"></div>
      <div id="boom"></div>
    </div>

    <footer>
      <div class="container">
        <div class="footer-item flex-center-center">
          <a href="https://github.com/K98940" target="_blank">K98940</a>
        </div>
        <div class="footer-item">2023</div>
        <div class="footer-item">
          <div class="footer-item flex-center-center">
            <a href="https://rs.school/js-stage0/" class="rss-logo" target="_blank"> </a>
          </div>
        </div>
      </div>
    </footer>
    <script type="module" src="./js/index.js"></script>
  </body>
</html>
